###############################
#Health Dice Properties
###############################
[health]
	# Enables modification for this attribute.
	enable = true
	# When true, the die type is picked automatically based on the
	# mob's vanilla attribute value (e.g. low-HP mobs use small dice,
	# bosses use d20). The 'diceType' setting below is used only as a
	# fallback and when autoDice is false.
	# Per-mob datapack overrides still take precedence over both.
	autoDice = true
	# The type of dice to use for calculations when autoDice is false.
	# See https://www.dieharddice.com/pages/dnd-dice-explained
	# Values: 2, 4, 6, 8, 10, 12, 20
	diceType = 6
	#the range factor
	# Default: 2.0
	# Range: 2.0 ~ 10.0
	rangeFactor = 2.0
	# Permitted mobs for that should receive attribute modification.
	# ex. minecraft:zombie
	mobWhitelist = []
	# Denied mobs for that should not receive attribute modification.
	# ex. minecraft:ghast
	mobBlacklist = []
	#bonus
	# Default: 0.0
	# Range: 0.0 ~ 1024.0
	bonus = 0.0

